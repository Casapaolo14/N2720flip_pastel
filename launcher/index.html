<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorbet Launcher</title>
<link rel="stylesheet" href="style.css">
<script src="launcher.js" defer></script>
</head>
<body data-layout="1">
  <header id="top">
    <span id="date" class="tag"></span>
    <span id="clock" class="chrome"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer id="softkeys">
    <span id="sk-left">Notices</span>
    <span id="sk-mid">Open</span>
    <span id="sk-right">Contacts</span>
  </footer>
</body>
</html>
