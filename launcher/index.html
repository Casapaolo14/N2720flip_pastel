<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorbet Launcher</title>
<link rel="stylesheet" href="style.css">
<script src="launcher.js" defer></script>
</head>
<body>
  <header id="top">
    <span id="date" class="tag"></span>
    <span id="batt" class="chrome"></span>
  </header>
  <main id="view" aria-live="polite"></main>
  <div id="dialer" hidden><span class="tag">Dial</span><div id="dial-num"></div></div>
  <footer id="softkeys">
    <span id="sk-left"></span>
    <span id="sk-mid">Open</span>
    <span id="sk-right"></span>
  </footer>
</body>
</html>
